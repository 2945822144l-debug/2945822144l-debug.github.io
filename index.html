<style>
:root{
  /* 档案纸 */
  --paper:#E8EDF0;
  --paper-2:#EDF1F3;
  --sheet:#FBFCFD;
  --panel:#FBFCFD;
  /* 墨 */
  --ink:#14202A;
  --ink-2:#55636E;
  --ink-3:#8B98A2;
  /* 表格线 */
  --line:#C9D4DB;
  --rule:#C9D4DB;
  --rule-2:#DDE5EA;
  /* 印章 */
  --accent:#B23A2E;
  --accent-soft:#F4E2DE;
  --stamp:#B23A2E;
  --stamp-soft:#F4E2DE;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  font-weight:400;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

/* 档案夹：桌面上一张纸，手机上满屏 */
.phone{
  position:relative;
  width:100%;max-width:420px;
  height:100dvh;max-height:900px;
  background:var(--sheet);
  overflow:hidden;
  display:flex;flex-direction:column;
}
@media (min-width:520px){
  .phone{border:1px solid var(--rule);box-shadow:0 26px 64px rgba(20,32,42,.13)}
}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:calc(20px + var(--safe-t)) 24px calc(20px + var(--safe-b));
  opacity:0;visibility:hidden;
  transition:opacity .2s ease,visibility .2s;
  overflow:hidden;
}
.screen.on{opacity:1;visibility:visible}

/* 公文抬头 */
.dochead{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--ink);padding-bottom:9px;
}
.docname{font-size:12.5px;font-weight:800;letter-spacing:.03em}
.docno{
  font-size:10.5px;letter-spacing:.16em;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

/* ---------- start ---------- */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
/* 证件照 */
.photo{
  width:184px;margin:0 auto 26px;
  border:1px solid var(--rule);background:#F4F7F8;
  padding:14px 14px 0;
  display:flex;flex-direction:column;align-items:center;
}
.ph-slot{
  width:100%;height:150px;border:1px solid var(--rule-2);background:#EDF1F3;
  display:flex;align-items:center;justify-content:center;
}
.ph-slot span{font-size:9.5px;letter-spacing:.3em;color:var(--ink-3);text-indent:.3em}
.photo-cap{
  width:100%;border-top:1px solid var(--rule);margin-top:10px;padding:8px 0 9px;
  font-size:10px;letter-spacing:.18em;color:var(--ink-3);text-align:center;
}
.hero h1{
  font-size:41px;line-height:1.12;font-weight:900;letter-spacing:-.035em;
}
.hero .sub{margin-top:18px;font-size:13.5px;line-height:1.85;color:var(--ink-2)}
/* 表头字段 */
.fieldrow{
  display:flex;margin-top:26px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule-2);
}
.fitem{flex:1;padding:11px 0}
.fitem + .fitem{border-left:1px solid var(--rule-2);padding-left:18px}
.fitem-k{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:5px}
.fitem-v{font-size:13px;font-weight:700;letter-spacing:.02em}
.btn{
  width:100%;border:1px solid var(--ink);border-radius:0;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.08em;
  padding:16px 20px;
  background:var(--ink);color:var(--sheet);
  transition:transform .16s ease,background .16s;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.meta{
  margin-top:13px;text-align:center;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
}

/* ---------- quiz ---------- */
/* 表头即进度条 */
.qhead{position:relative;display:flex;align-items:center;gap:14px;padding-bottom:16px}
.qhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rule-2)}
.back{
  width:26px;height:26px;flex:0 0 26px;border:1px solid var(--rule);border-radius:0;
  background:transparent;cursor:pointer;
  display:grid;place-items:center;font-size:13px;color:var(--ink-2);
  transition:border-color .16s,background .16s;
}
.back:hover{border-color:var(--ink);background:var(--paper-2)}
.back[hidden]{visibility:hidden}
.qcount{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qcount b{color:var(--ink);font-weight:800}
.pbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.pbar i{display:block;height:100%;width:0;background:var(--stamp);transition:width .34s cubic-bezier(.4,0,.2,1)}
.qbody{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:6px;scrollbar-width:none}
.qbody::-webkit-scrollbar{display:none}
.qwrap{margin:auto 0;padding:0 0 20px}
.qchip{
  font-size:10.5px;letter-spacing:.16em;color:var(--stamp);
  font-weight:800;margin-bottom:15px;
}
.qtitle{
  font-size:25px;line-height:1.5;font-weight:800;letter-spacing:-.015em;
  margin-bottom:22px;text-wrap:pretty;
}
.qtitle .nb{white-space:nowrap}
.opts{display:flex;flex-direction:column}

/* 表单式选项：细线分隔，无卡片 */
.opt{
  display:flex;align-items:flex-start;gap:13px;
  width:100%;text-align:left;font-family:inherit;cursor:pointer;
  font-size:14.5px;line-height:1.72;font-weight:400;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--rule-2);
  padding:15px 8px 15px 2px;
  text-wrap:pretty;word-break:normal;
  transition:background .16s,box-shadow .16s;
}
.opt:first-child{border-top:1px solid var(--rule-2)}
.opt:hover{background:#F4F7F8}
.opt.sel{background:var(--stamp-soft);box-shadow:inset 2px 0 0 var(--stamp)}
.opt .k{
  flex:0 0 21px;width:21px;height:21px;margin-top:2px;
  border:1px solid var(--ink-3);border-radius:0;
  display:grid;place-items:center;
  font-size:10.5px;font-weight:800;color:var(--ink-3);
  transition:background .16s,border-color .16s,color .16s;
}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt .t{flex:1;min-width:0}
.opt .nb{white-space:nowrap}
.qhint{
  text-align:center;font-size:10.5px;color:var(--ink-3);
  padding-top:13px;border-top:1px solid var(--rule-2);letter-spacing:.06em;
}

/* ---------- result ---------- */
#scr-result{padding-bottom:calc(22px + var(--safe-b));overflow-y:auto;scrollbar-width:none}
#scr-result::-webkit-scrollbar{display:none}
.cert{position:relative}
.cert-top{
  display:flex;align-items:baseline;justify-content:space-between;
  border-top:3px solid var(--ink);padding-top:9px;margin-bottom:24px;
}
.rlabel{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:12px}
.rhero{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.rhero-t{min-width:0}
.disc{display:grid;place-items:center;border-radius:0}
.rhero .disc{width:92px;height:92px;flex:0 0 92px}
.rname{font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1.08}
.rtagline{margin-top:7px;font-size:12.5px;color:var(--ink-2);line-height:1.6}

/* 字段表 */
.fields{border-top:1px solid var(--rule)}
.field{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule-2)}
.field .fk{
  flex:0 0 58px;font-size:10px;letter-spacing:.12em;color:var(--ink-3);
  padding-top:4px;
}
.field .fv{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:11.5px;padding:3px 8px;border-radius:0;
  background:transparent;color:var(--ink-2);border:1px solid var(--rule);
}
.desc{font-size:14px;line-height:1.98;color:#26333D}
.desc .tip{
  margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-2);
  font-size:11.5px;line-height:1.9;color:var(--ink-3);
}
.paircard{display:flex;align-items:center;gap:12px}
.paircard .disc{width:44px;height:44px;flex:0 0 44px}
.paircard p{font-size:13px;line-height:1.7;color:var(--ink-2)}
.paircard b{color:var(--ink);font-weight:800}
.pair-combo{
  display:block;margin:3px 0 5px;
  font-size:10px;letter-spacing:.14em;color:var(--ink-3);
}

/* 印章：唯一的高音，压在说明末尾的横线上 */
.stamp-wrap{display:flex;justify-content:flex-end;margin:-26px 2px -6px 0}
.stamp{
  width:66px;height:66px;border-radius:50%;
  border:2px solid var(--stamp);color:var(--stamp);
  display:grid;place-items:center;
  font-size:10.5px;font-weight:800;letter-spacing:.08em;
  transform:rotate(-8deg);opacity:.88;
  box-shadow:inset 0 0 0 3px var(--sheet),inset 0 0 0 4px var(--stamp);
}
.stamp.in{animation:press .46s cubic-bezier(.2,1.25,.4,1) both}
@keyframes press{
  from{transform:rotate(-8deg) scale(1.7);opacity:0}
  to{transform:rotate(-8deg) scale(1);opacity:.9}
}

/* 八维：横条，体检报告 */
.sec{margin-top:28px}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sech h3{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink-2)}
.sech span{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.chart{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:54px 1fr 20px;align-items:center;gap:10px}
.blabel{font-size:11px;color:var(--ink-2);white-space:nowrap}
.track{height:7px;background:var(--paper-2);overflow:hidden}
.fill{height:100%}
.bval{
  font-size:10.5px;color:var(--ink-3);text-align:right;
  font-variant-numeric:tabular-nums;
}
.rfoot{margin-top:26px;display:flex;flex-direction:column;gap:10px}

/* ---------- atlas sheet ---------- */
.sheet{
  position:absolute;inset:0;z-index:40;
  background:rgba(20,32,42,.44);
  display:flex;align-items:flex-end;
  opacity:0;visibility:hidden;transition:opacity .26s,visibility .26s;
}
.sheet.on{opacity:1;visibility:visible}
.sheet-inner{
  width:100%;max-height:88%;background:var(--sheet);
  border-top:3px solid var(--ink);
  padding:20px 24px calc(24px + var(--safe-b));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  overflow-y:auto;scrollbar-width:none;
}
.sheet.on .sheet-inner{transform:none}
.sheet-inner::-webkit-scrollbar{display:none}
.sheet-top{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid var(--ink);
}
.sheet-top h2{font-size:12.5px;font-weight:800;letter-spacing:.08em}
.close{
  border:0;background:transparent;font-size:18px;color:var(--ink-3);
  cursor:pointer;line-height:1;padding:0 2px;
}
.atlas{display:flex;flex-direction:column;margin-top:4px}
.card{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:transparent;border:0;border-bottom:1px solid var(--rule-2);
  padding:13px 2px;
  transition:background .16s;
}
.card:hover{background:#F4F7F8}
.card .row{display:flex;align-items:center;gap:12px}
.card .nm{font-size:13.5px;font-weight:800}
.card .tl{
  font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.65;
  padding-left:56px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card.open .tl{-webkit-line-clamp:unset;display:block}
.mini{
  width:44px;height:44px;flex:0 0 44px;
  display:grid;place-items:center;border:1px solid var(--rule);
}
.card.mystery{border-bottom:0;border-top:1px dashed var(--rule);margin-top:0;padding-top:14px}
.card:nth-last-child(2){border-bottom:0;padding-bottom:4px}
.card.mystery .nm{color:var(--ink-2);letter-spacing:.14em}
.card.mystery .tl{color:var(--ink-3)}
.card.mystery .qm{
  width:44px;height:44px;flex:0 0 44px;border:1px solid var(--rule);
  display:grid;place-items:center;color:var(--ink-3);
  font-size:19px;font-weight:800;
}

.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);
  background:var(--ink);color:var(--sheet);font-size:12px;
  padding:10px 18px;border-radius:0;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:60;white-space:nowrap;
  letter-spacing:.04em;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>

    const ew=f.eyeR[0], eh=f.eyeR[1];
    const d=`M${ex-ew} ${f.eyeY} Q${ex} ${f.eyeY-eh*1.36} ${ex+ew} ${f.eyeY} Q${ex} ${f.eyeY+eh*1.02} ${ex-ew} ${f.eyeY} Z`;
    const gx=f.gaze==="left"?-2.1:(f.gaze==="out"?(right?2.3:-2.3):0);
    const px=ex+gx, py=f.eyeY+1;
    const ly=f.eyeY-eh*.62+f.lid*eh*1.30;
    return `<clipPath id="${id}e${right?1:0}"><path d="${d}"/></clipPath>`
      +`<path d="${d}" fill="${INK}"/>`
      +`<g clip-path="url(#${id}e${right?1:0})"><circle cx="${px}" cy="${py}" r="${eh*.64}" fill="#5A4632"/>`
      +`<circle cx="${px-eh*.30}" cy="${py-eh*.34}" r="${eh*.30}" fill="#FFF" opacity=".92"/>
        <circle cx="${px+eh*.34}" cy="${py+eh*.40}" r="${eh*.13}" fill="#FFF" opacity=".55"/></g>`
      +`<path d="M${ex-ew-3} ${f.eyeY-eh*1.5} H${ex+ew+3} V${ly} Q${ex} ${ly-2} ${ex-ew-3} ${ly} Z" fill="${fur}"/>`;
  };

  const my=ny+8.5;
  const mouth=(()=>{
    if(f.mouth==="open"){
      const t=f.tongue?`<path d="M${cx-6.5} ${my+3} Q${cx} ${my+17} ${cx+6.5} ${my+3} Q${cx} ${my+8} ${cx-7} ${my+3} Z" fill="#C9645C"/>`:"";
      return `<path d="M${cx-15} ${my-2} Q${cx} ${my+17} ${cx+15} ${my-2} Q${cx} ${my+3} ${cx-15} ${my-2} Z" fill="${INK}"/>`+t;
    }
    if(f.mouth==="smile") return `<path d="M${cx} ${my} q-8 9 -16 4 M${cx} ${my} q8 9 16 4" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    if(f.mouth==="smirk") return `<path d="M${cx-10} ${my+4} q9 6 17 -3" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    return `<path d="M${cx-9} ${my+2} q9 3.5 18 0" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  })();

  const nose=`<path d="M${cx-7*f.noseS} ${ny} Q${cx} ${ny-3.4*f.noseS} ${cx+7*f.noseS} ${ny} Q${cx+8.2*f.noseS} ${ny+2.8*f.noseS} ${cx+4.2*f.noseS} ${ny+5.2*f.noseS} Q${cx} ${ny+7.8*f.noseS} ${cx-4.2*f.noseS} ${ny+5.2*f.noseS} Q${cx-8.2*f.noseS} ${ny+2.8*f.noseS} ${cx-7*f.noseS} ${ny} Z" fill="${INK}"/>`
    +`<ellipse cx="${cx-1.6}" cy="${ny+1.2}" rx="2.1" ry="1.1" fill="#FFF" opacity=".40"/>`;
  const philtrum=`<path d="M${cx} ${ny+6} V${my-1}" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;

  return `<svg viewBox="0 0 180 180" width="${size}" height="${size}" aria-hidden="true">
    <defs><clipPath id="${id}h"><path d="${hp}"/></clipPath>${b.line?`<radialGradient id="${id}f" gradientUnits="userSpaceOnUse" cx="86" cy="78" r="66"><stop offset="46%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D9E4EA"/></radialGradient>`:""}</defs>
    <g transform="rotate(${f.tilt} ${cx} ${cy-2})">
      ${ears}${crown}${knot}${head}
      <g clip-path="url(#${id}h)">${mask}${blaze}${mz}${blush}${ridge}${brows}</g>
      ${eye(cx-f.eyeDX,false)}${eye(cx+f.eyeDX,true)}
      ${nose}${philtrum}${mouth}
    </g>
  </svg>`;
}
function hex(c,a){
  const n=parseInt(c.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ============ 状态 ============ */
const $=s=>document.querySelector(s);
let idx=0, score={}, answers={}, picks={};

/* 启动页：档案照留白，不放狗头 */

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(id).classList.add("on");
  $(id).scrollTop=0;
}

/* ============ 答题 ============ */
function renderQ(){
  const q=QUIZ[idx];
  $("#qNow").textContent=String(idx+1).padStart(2,"0");
  $("#pFill").style.width=((idx)/QUIZ.length*100)+"%";
  $("#qChip").textContent=q.label.replace(/^(\d+)\s*·\s*/, (m,n)=>"第 "+n+" 项　");
  $("#qTitle").innerHTML=q.title.replace(/「[^」]*」/g, m=>`<span class="nb">${m}</span>`);
  $("#backBtn").hidden = idx===0;
  const box=$("#qOpts");
  box.innerHTML="";
  q.opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt"+(answers[idx]===o[1]?" sel":"");
    b.innerHTML=`<span class="k">${"ABC"[i]}</span><span class="t">${o[0].replace(/「[^」]*」/g, m=>m.length<=8?`<span class="nb">${m}</span>`:m)}</span>`;
    b.onclick=()=>pick(o[1],b,i);
    box.appendChild(b);
  });
  $("#scr-quiz").scrollTop=0;
}
function pick(key,el,i){
  if(lock) return;
  lock=true;
  if(answers[idx]) score[answers[idx]]--;
  answers[idx]=key;
  picks[idx]=i;
  score[key]=(score[key]||0)+1;
  document.querySelectorAll("#qOpts .opt").forEach(e=>e.classList.remove("sel"));
  el.classList.add("sel");
  setTimeout(()=>{
    lock=false;
    if(idx<QUIZ.length-1){ idx++; renderQ(); }
    else showResult();
  },190);
}
let lock=false;
$("#backBtn").onclick=()=>{
  if(idx===0) return;
  idx--; renderQ();
};
$("#startBtn").onclick=()=>{
  score={}; answers={}; picks={}; idx=0;
  renderQ(); show("#scr-quiz");
};

/* ============ 结果 ============ */
function showResult(){
  const ent=Object.entries(score).sort((a,b)=>b[1]-a[1]);
  const top=ent[0]?ent[0][1]:0;
  let tops=ent.filter(([k,v])=>v===top&&v>0).map(([k])=>k);
  for(let i=tops.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tops[i],tops[j]]=[tops[j],tops[i]];}

  // 隐藏人格：25 题的选项序列必须完全等于 SECRET_SEQ
  const seq=QUIZ.map((q,i)=>picks[i]==null?"-":"abc"[picks[i]]).join("");
  const secret = seq===SECRET_SEQ;

  const main = secret ? "lord" : (tops[0]||"samoyed");
  const b=BREEDS[main];
  const extras = secret ? [] : tops.slice(1).filter(k=>BREEDS[k]);

  const rl=document.querySelector(".rlabel");
  rl.textContent = secret ? "隐藏人格 ／ 万分之一" : "你是";
  rl.style.color = secret ? "var(--stamp)" : "";

  $("#rDisc").outerHTML = `<div class="disc" id="rDisc" style="background:${hex(b.tint||b.c,.16)};border:1px solid ${hex(b.tint||b.c,.28)}">${dogSVG(main,88)}</div>`;
  $("#rName").textContent=b.n;
  $("#rName").style.fontSize=b.ns?b.ns+"px":"";
  $("#rName").style.color=secret?"var(--stamp)":"var(--ink)";
  $("#rTag").textContent=b.t;
  $("#rTags").innerHTML=b.tags.map(t=>`<span class="chip">${t}</span>`).join("")
    + (extras.length?`<span class="chip">还带点 ${extras.map(k=>BREEDS[k].n).join("、")} 的影子</span>`:"");
  const _ti=b.d.indexOf("（小tips：");
  if(_ti>=0){
    $("#rDesc").innerHTML=b.d.slice(0,_ti)+`<div class="tip">${b.d.slice(_ti)}</div>`;
  }else{
    $("#rDesc").textContent=b.d;
  }

  // 八维
  // 隐藏人格：手欠一栏直接拉满，其余按实际作答
  const shown = secret ? Object.assign({},score,{husky:11}) : score;
  const max=Math.max(1,...Object.values(shown));
  $("#rChart").innerHTML=DIMS.map(([k,label])=>{
    const v=shown[k]||0;
    const w=Math.round(v/max*100);
    const tone = (v>0 && v===max) ? "var(--stamp)" : "var(--ink)";
    return `<div class="bar">
      <div class="blabel">${label}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:${tone}"></div></div>
      <div class="bval">${v}</div>
    </div>`;
  }).join("");

  // 搭子
  const bud=BREEDS[b.buddy];
  const bline=b.bline||`${bud.n}的${bud.tags[0]}，刚好接得住你的${b.tags[0]}。`;
  $("#rPair").innerHTML=`
    <div class="disc" style="background:${hex(bud.tint||bud.c,.16)};border:1px solid ${hex(bud.tint||bud.c,.28)}">${dogSVG(b.buddy,38)}</div>
    <p><b>${bud.n}</b><span class="pair-combo">${b.combo}</span>${bline}</p>`;

  current=main;
  show("#scr-result");
  const st=$("#rStamp");
  st.classList.remove("in"); void st.offsetWidth; st.classList.add("in");
}
let current=null;

/* ============ 图鉴 ============ */
function buildAtlas(){
  const list=Object.entries(BREEDS).filter(([k,v])=>!v.secret&&k!=="husky");
  $("#atlasGrid").innerHTML=list.map(([k,b])=>`
    <button class="card" data-k="${k}">
      <div class="row">
        <div class="mini" style="background:${hex(b.tint||b.c,.16)}">${dogSVG(k,42)}</div>
        <div class="nm">${b.n}</div>
      </div>
      <div class="tl">${b.t}<br>${b.tags.join("、")}</div>
    </button>`).join("")
    + `<button class="card mystery" data-k="mystery">
        <div class="row"><div class="qm">?</div><div class="nm">？？？</div></div>
        <div class="tl">名册上没有这一只。据说只有一种答法能见到它——25 题的顺序，错一个字都不行。见过的人说它是金色的，站着就很不服气，还特别手欠。</div>
      </button>`;
  document.querySelectorAll("#atlasGrid .card").forEach(c=>{
    c.onclick=()=>c.classList.toggle("open");
  });
}
buildAtlas();
$("#atlasBtn").onclick=()=>$("#sheet").classList.add("on");
$("#closeAtlas").onclick=()=>$("#sheet").classList.remove("on");
$("#sheet").onclick=e=>{ if(e.target.id==="sheet") $("#sheet").classList.remove("on"); };

/* ============ 其他 ============ */
$("#againBtn").onclick=()=>{ score={}; answers={}; picks={}; idx=0; renderQ(); show("#scr-quiz"); };
$("#shareBtn").onclick=async()=>{
  const b=BREEDS[current]||BREEDS.samoyed;
  const text=`我测出来是「${b.n} · ${b.t}」你也来测测，看看你是哪只小狗`;
  try{
    if(navigator.share){ await navigator.share({title:"测测你是什么小狗",text,url:location.href}); }
    else { await navigator.clipboard.writeText(text+" "+location.href); toast("结果文案已复制"); }
  }catch(e){}
};
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1900);
}

/* 预览用：地址栏加 #quiz / #result / #atlas / #q2 可直接跳到对应页面 */
const _qm=location.hash.match(/^#q(\d+)$/);
if(_qm){
  idx=Math.min(Math.max(parseInt(_qm[1],10)-1,0),QUIZ.length-1);
  renderQ(); show("#scr-quiz");
}else if(location.hash==="#result"){
  score={}; answers={}; idx=0;
  QUIZ.forEach(q=>{ const o=q.opts.find(o=>o[1]==="samoyed")||q.opts[0]; score[o[1]]=(score[o[1]]||0)+1; });
  showResult();
}else if(location.hash==="#lord"){
  score={}; answers={}; picks={}; idx=0;
  QUIZ.forEach((q,i)=>{
    const j="abc".indexOf(SECRET_SEQ[i]);
    const o=q.opts[j]||q.opts[0];
    score[o[1]]=(score[o[1]]||0)+1; answers[i]=o[1]; picks[i]=j;
  });
  showResult();
}else if(location.hash==="#atlas"){
  $("#sheet").classList.add("on");
}else if(location.hash==="#quiz"){
  idx=0; renderQ(); show("#scr-quiz");
}
</script>
</body>
</html>
